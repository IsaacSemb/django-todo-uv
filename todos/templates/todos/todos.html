{% extends 'website/base.html' %} {% block content %}


<div class="relative overflow-x-auto max-w-[1100px] mx-auto mt-8">
    
    <div class="px-6 py-3 font-semibold text-gray-700 uppercase #dark:bg-gray-700 #dark:text-gray-400 flex justify-between">
        <span>
            All todos
        </span>
    
        <button
        type="button"
        class="flex items-center text-gray-900 hover:text-white border border-gray-800 hover:bg-gray-900 focus:ring-1 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800"
        >

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M11 13H5v-2h6V5h2v6h6v2h-6v6h-2z"/></svg>
            <span>
                Add New Todo
            </span>
        </button>
    
    </div>
    
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 #dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 #dark:bg-gray-700 #dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3">
                    id
                </th>
                <th scope="col" class="px-6 py-3">
                    title
                </th>
                <th scope="col" class="px-6 py-3">
                    description
                </th>
                <th scope="col" class="px-6 py-3">
                    status
                </th>
                <th scope="col" class="px-6 py-3">
                    Action
                </th>
            </tr>
        </thead>
        <tbody>
        {% for todo in todos %}

            <tr class="bg-white border-b #dark:bg-gray-800 #dark:border-gray-700 border-gray-200">
                <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap #dark:text-white">
                    {{todo.id}}
                </th>
                <td class="px-6 py-4">
                    {{todo.title}}
                </td>
                <td class="px-6 py-4">
                    {{todo.description}}
                </td>
                <td class="px-6 py-4">
                    {{todo.status}}
                </td>
                
                <td class="px-6 py-4">
                    <button class='bg-red-100 rounded-lg cursor-pointer'>
                        <svg class="text-red-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zm2-4h2V8H9zm4 0h2V8h-2z"/></svg>
                    </button>
                    <button class='bg-gray-100 rounded-lg cursor-pointer'>
                        <svg class="text-gray-900" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32"><g fill="currentColor"><path d="M4 28.479a.5.5 0 0 0 .143-.021l10-2.979a.5.5 0 0 0 .213-.127l10.09-10.205c.023-.024.035-.053.052-.08l3.658-3.658a1.56 1.56 0 0 0 0-2.203L22.92 3.972a1.56 1.56 0 0 0-2.202 0l-3.739 3.739c-.024.024-.036.054-.054.081L6.807 17.911a.5.5 0 0 0-.122.199l-3.16 9.715a.5.5 0 0 0 .475.654M17.359 8.771l1.04 1.04l-8.523 8.563l-1.727-.392zM10.5 19.165l8.607-8.646l2.434 2.434l-8.745 8.547H10.5zm12.885-4.368l-9.246 9.352l-.576-1.999l8.684-8.489zM7.493 18.859l2.007.456V22a.5.5 0 0 0 .5.5h2.624l.633 2.2l-8.487 2.528zm13.932-14.18a.56.56 0 0 1 .788 0l5.235 5.235a.56.56 0 0 1 0 .789l-3.372 3.372l-6.023-6.023z"/></g></svg>
                    </button>
                </td>
            </tr>
    {% endfor %}

        </tbody>
    </table>
</div>


{% endblock %}
