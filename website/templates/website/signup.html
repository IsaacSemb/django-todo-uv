{% extends 'website/auth_base.html' %}

{% block title %}Sign Up - Todo App{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <!-- Blurred background pattern -->
    <div class="absolute inset-0 bg-gradient-to-br from-gray-100 via-gray-50 to-gray-200">
        <div class="absolute inset-0" style="backdrop-filter: blur(10px);"></div>
    </div>
    
    <!-- Modal card -->
    <div class="relative w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
            <!-- Decorative gradient bar -->
            <div class="h-1 bg-gradient-to-r from-gray-200 via-gray-400 to-gray-200"></div>
            
            <div class="p-8 sm:p-10">
                <!-- Back to home link -->
                <a href="{% url 'website:home' %}" class="inline-flex items-center text-sm text-gray-600 hover:text-gray-900 mb-6 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 mr-2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Back to home
                </a>
                
                <!-- Header -->
                <h1 class="text-4xl font-bold text-gray-900 mb-8">Create an account</h1>
                
                <!-- Sign Up Form -->
                <form class="space-y-4" action="#" method="POST">
                    {% csrf_token %}
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-900 mb-2">Username</label>
                        <input type="text" name="username" id="username" class="w-full bg-white border border-gray-300 text-gray-900 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" placeholder="Choose a username" required>
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-900 mb-2">Email</label>
                        <input type="email" name="email" id="email" class="w-full bg-white border border-gray-300 text-gray-900 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" placeholder="Enter your email" required>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-900 mb-2">Password</label>
                        <input type="password" name="password" id="password" class="w-full bg-white border border-gray-300 text-gray-900 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" placeholder="••••••••" required>
                    </div>
                    
                    <div>
                        <label for="password_confirm" class="block text-sm font-medium text-gray-900 mb-2">Confirm Password</label>
                        <input type="password" name="password_confirm" id="password_confirm" class="w-full bg-white border border-gray-300 text-gray-900 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all" placeholder="••••••••" required>
                    </div>
                    
                    <div class="flex items-center">
                        <input id="terms" name="terms" type="checkbox" class="w-4 h-4 border-gray-300 bg-white rounded focus:ring-gray-900 text-gray-900" required>
                        <label for="terms" class="ml-2 text-sm text-gray-600">
                            I agree to the <a href="#" class="text-gray-900 font-medium hover:underline transition-colors">Terms and Conditions</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="w-full bg-gray-900 border border-gray-900 text-white font-medium rounded-lg px-4 py-3 hover:bg-gray-800 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                        Create account
                    </button>
                </form>
                
                <!-- Sign In Link -->
                <p class="mt-6 text-center text-sm text-gray-600">
                    Already have an account? <a href="{% url 'website:login' %}" class="text-gray-900 font-medium hover:underline transition-colors">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
